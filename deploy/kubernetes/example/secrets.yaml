# The model key: field "value" of item "anthropic" in the Proton Pass vault
# k8s-aemtli (the vault is picked by the namespace). Only aemtli-model-proxy
# mounts it, as the file /secrets/model/key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aemtli-model
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-pass
  target:
    name: aemtli-model
  data:
    - secretKey: key
      remoteRef:
        key: anthropic
        property: value
---
# The secret between the web UI and goose serve. Generated once by ESO and
# never shown to anyone. CreatedOnce keeps it from rotating under a running
# chat, and makes a new one if the Secret is ever deleted (restart both pods
# then).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: aemtli-goose-server
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aemtli-goose-server
spec:
  refreshPolicy: CreatedOnce
  target:
    name: aemtli-goose-server
    template:
      data:
        GOOSE_SERVER__SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: aemtli-goose-server
