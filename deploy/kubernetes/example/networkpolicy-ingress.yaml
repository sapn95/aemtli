# Only the Cloudflare tunnel's connector may reach the UI. Access in front of
# it decides who gets that far; the UI checks Access's token again itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aemtli-web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aemtli-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8080
---
# The jobs reach the web pod's notify port, where they hand in a push with a
# token (NOTIFY_URL in the CronJobs), and no other port of it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aemtli-web-notify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aemtli-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aemtli-run
      ports:
        - port: 8082
