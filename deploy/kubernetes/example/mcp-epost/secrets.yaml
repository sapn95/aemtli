# The epost gateway's two secrets. The ePost API login comes from the Proton
# Pass item "epost" (fields "user" and "password"; the password is the one
# set on the ePost Keycloak account, see the epost-mcp README). The token
# between the UI and every gateway is generated: one key per gateway in
# aemtli-gateway-tokens, which the UI mounts whole and each gateway mounts
# only its own key of.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aemtli-mcp-epost
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-pass
  target:
    name: aemtli-mcp-epost
  data:
    - secretKey: EPOST_SWISSID_USER
      remoteRef:
        key: epost
        property: user
    - secretKey: EPOST_API_PASSWORD
      remoteRef:
        key: epost
        property: password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: aemtli-gateway-token
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aemtli-gateway-tokens
spec:
  refreshPolicy: CreatedOnce
  target:
    name: aemtli-gateway-tokens
  dataFrom:
    # One entry per gateway, each its own generated password.
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: aemtli-gateway-token
      rewrite:
        - regexp:
            source: password
            target: epost
