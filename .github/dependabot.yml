version: 2
# One grouped pull request per ecosystem per week. Every update merges itself
# once the checks are green — majors included; the `no-automerge` label is the
# manual hold. See .github/workflows/dependabot-auto-merge.yml for both halves
# of that, and https://github.com/sapn95/.github/blob/main/CI.md for the rest.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Odd node majors never become LTS and are end of life within months of
    # release (25 already is); the image stays on the even, LTS line.
    ignore:
      - dependency-name: "library/node"
        versions: ["25.x", "27.x", "29.x"]
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]
