<!DOCTYPE html>
<html lang="en">
<head>
  <title>Kanban Boards</title>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css?v=d5ee4d204c04">
  <link rel="stylesheet" href="/static/app.css?v=d5ee4d204c04">
  
  <script src="/static/theme.js?v=d5ee4d204c04"></script>

</head>
<body>
<div class="container narrow">
  <header class="header">
    <h1 class="board-title">Kanban Boards</h1>
    


    <a href="/search" class="icon-btn toggle" title="Search all boards" aria-label="Search all boards"><i class="bi bi-search"></i></a>
    
<button type="button" id="darkModeToggle" class="icon-btn toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
  <i class="bi bi-sun light-only"></i>
  <i class="bi bi-moon dark-only"></i>
</button>

  </header>

  <ul class="board-list">
    
      <li class="board-item">
        <div class="board-item-main">
          <a class="board-link" href="/b/main">Kanban Board</a>
          <span class="board-meta">0 cards</span>
        </div>
        <details class="board-action">
          <summary title="Rename" aria-label="Rename"><i class="bi bi-pencil"></i></summary>
          <form method="post" action="/b/main/rename" class="inline-form">
            <input type="text" name="name" value="Kanban Board" required maxlength="100" aria-label="New name">
            <button type="submit" class="btn btn-primary">Rename</button>
          </form>
        </details>
        <details class="board-action">
          <summary title="Delete" aria-label="Delete" class="danger"><i class="bi bi-trash"></i></summary>
          <form method="post" action="/b/main/delete" class="inline-form">
            <input type="text" name="confirm" required autocomplete="off" placeholder="Type “Kanban Board” to delete it and its cards" aria-label="Board name">
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </details>
      </li>
    
      <li class="board-item">
        <div class="board-item-main">
          <a class="board-link" href="/b/aemtli">Ämtli</a>
          <span class="board-meta">2 cards</span>
        </div>
        <details class="board-action">
          <summary title="Rename" aria-label="Rename"><i class="bi bi-pencil"></i></summary>
          <form method="post" action="/b/aemtli/rename" class="inline-form">
            <input type="text" name="name" value="Ämtli" required maxlength="100" aria-label="New name">
            <button type="submit" class="btn btn-primary">Rename</button>
          </form>
        </details>
        <details class="board-action">
          <summary title="Delete" aria-label="Delete" class="danger"><i class="bi bi-trash"></i></summary>
          <form method="post" action="/b/aemtli/delete" class="inline-form">
            <input type="text" name="confirm" required autocomplete="off" placeholder="Type “Ämtli” to delete it and its cards" aria-label="Board name">
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </details>
      </li>
    
  </ul>

  <form method="post" action="/boards" class="inline-form new-board">
    <input type="text" name="name" required maxlength="100" placeholder="New board name" aria-label="New board name">
    <button type="submit" class="btn btn-primary"><i class="bi bi-plus"></i> Add Board</button>
  </form>
</div>
<script src="/static/app.js?v=d5ee4d204c04"></script>
</body>
</html>
