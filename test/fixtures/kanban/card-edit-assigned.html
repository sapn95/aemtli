
<form hx-post="/card/1/update" hx-target="#card-1" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
  <div class="modal-header">
    <h5>Edit Card</h5>
    <button type="button" class="icon-btn" data-close-modal title="Close" aria-label="Close"><i class="bi bi-x"></i></button>
  </div>
  <div class="modal-body">
    
<label class="field">
  <span>Title</span>
  <input type="text" name="title" value="Zugewiesen" placeholder="Card Title">
</label>
<label class="field">
  <span>Description</span>
  <textarea name="description" rows="3" placeholder="Description"></textarea>
</label>
<label class="field">
  <span>Due date</span>
  <input type="date" name="due" value="">
</label>
<div class="field">
  <span>Subtasks</span>
  <div class="subtasks-container">
    
  </div>
  <button type="button" class="btn btn-muted add-subtask-btn"><i class="bi bi-plus"></i> Add Subtask</button>
  <input type="hidden" name="subtasks" class="subtasks-hidden">
</div>

    
    <label class="field">
      <span>Column</span>
      <select name="lane">
        
        <option value="1" selected>To Do</option><option value="2">In Progress</option><option value="3">Done</option>
      </select>
    </label>
    
    
    <label class="field">
      <span>Assignee</span>
      <select name="assignee">
        <option value="">Nobody</option>
        
        <option value="helper@example.com" selected>helper@example.com</option><option value="owner@example.com">owner@example.com</option>
      </select>
    </label>
    
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
